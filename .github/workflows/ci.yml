name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (biome · tsc · vitest · artifact · dist-graph)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      # build both outputs and gate the prebuilt chrome shape (ADR-0001)
      - run: bun run build
      - run: bun run check:artifact
      # the node-side dist graph must stay inside builtins + dependencies + peers (#138)
      - run: bun run check:dist-graph
      # the published manifest/exports must be consumer-clean (needs the build)
      - run: bun run check:publint

  e2e:
    name: e2e (playwright)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      # stage the publish-shaped local link before the fixture resolves it (#123)
      - run: bun run prepare-local
      - run: bun install --cwd=e2e/fixture --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
