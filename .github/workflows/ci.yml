name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (biome · tsc · vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # pin npm to packageManager (keep in sync): setup-node bundles whatever
      # npm shipped with the runner's Node 24 patch (11.17.0 on 24.19.0), and
      # a newer npm's `npm ci` validation rejects lockfiles generated by a
      # different npm version (#211)
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      # the fixture install must precede npm test: the retirement-readiness
      # legs run under the root vitest config (npm test) and build the
      # canonical fixture (e2e/fixture has its own committed lockfile)
      - run: npm ci
        working-directory: e2e/fixture
      # vitest: the retained unit lanes (src/core tooling, packages/core,
      # packages/app-shell), the frozen-contract schema validators, and the
      # five serverless retirement-readiness legs (corpora re-derivation,
      # retained-UI coupling scan + mounts, fixture plainness + zero-byte
      # build, counts, inventory)
      - run: npm run test
      # ── no-product-E2E interval — the named state (ADR-0010) ──
      # There is NO product E2E lane until the web-host slices land (#240),
      # and this step is never presented as one. Exactly one serverless
      # Playwright spec survives the retirement gate (#215): the
      # plain-fixture build smoke. Playwright itself fails a config whose
      # testMatch matches zero specs, so the interval cannot silently pass
      # empty — deleting the last spec reds this step instead of vacuously
      # greening it. No browser is launched; no chromium install is needed.
      - name: no-product-E2E interval — plain-fixture build smoke (not product E2E, ADR-0010)
        run: npm run test:e2e

  # Retirement gate context (#215, lane A6): the integration runtime,
  # injected chrome, delivery lanes, npm artifact checks, Changesets, and
  # publish workflows are deleted; the root package is private. What CI
  # gates on is the retained tree: lint + types + the vitest lanes above,
  # and the one serverless fixture smoke as the explicit stand-in for E2E
  # until product E2E returns with the web host (#240).
