name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (biome · tsc · vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # pin npm to packageManager (keep in sync): setup-node bundles whatever
      # npm shipped with the runner's Node 24 patch (11.17.0 on 24.19.0), and
      # a newer npm's `npm ci` validation rejects lockfiles generated by a
      # different npm version (#211)
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      # the fixture install must precede npm test: the retirement-readiness
      # legs run under the root vitest config (npm test) and build the
      # canonical fixture (e2e/fixture has its own committed lockfile)
      - run: npm ci
        working-directory: e2e/fixture
      # vitest: the retained unit lanes (src/core tooling, packages/core,
      # packages/app-shell), the frozen-contract schema validators, and the
      # five serverless retirement-readiness legs (corpora re-derivation,
      # retained-UI coupling scan + mounts, fixture plainness + zero-byte
      # build, counts, inventory)
      - run: npm run test
      # ── product E2E is restored (#240, G1): the no-E2E interval of
      # ADR-0010 ends here ──
      # The web-host lane is a real Chromium against the real control
      # plane — the real origin listener, HTTP admission, SSE hub,
      # staged-activation supervisor, switch coordinator, and managed
      # `astro dev` children — over the isolated test registry the lane's
      # staging owns. The plain-fixture build smoke stays as its own
      # project. The playwright config fails at load when the web
      # project's spec discovery is vacuous (missing or emptied specs),
      # so this lane cannot pass with zero tests. The frozen
      # behavior-contract validators above remain the behavioral judge;
      # this lane is the live host.
      - run: npx playwright install --with-deps chromium
      - name: product E2E — web host (real browser, real control plane) + plain-fixture build smoke
        run: npm run test:e2e

  # Retirement gate context (#215, lane A6): the integration runtime,
  # injected chrome, delivery lanes, npm artifact checks, Changesets, and
  # publish workflows are deleted; the root package is private. What CI
  # gates on is the retained tree: lint + types + the vitest lanes above,
  # plus the restored product-E2E web-host lane and the plain-fixture
  # build smoke (#240).
