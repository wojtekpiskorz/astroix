name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (biome · tsc · vitest · artifact · dist-graph)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run test
      # build both outputs and gate the prebuilt chrome shape (ADR-0001)
      - run: npm run build
      - run: npm run check:artifact
      # the node-side dist graph must stay inside builtins + dependencies + peers (#138)
      - run: npm run check:dist-graph
      # the published manifest/exports must be consumer-clean (needs the build)
      - run: npm run check:publint

  e2e:
    name: e2e (playwright)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # stage the publish-shaped local link before the fixture resolves it (#123);
      # the fixture lockfile's file: dep resolves against this staging dir
      - run: npm run prepare-local
      - run: npm ci
        working-directory: e2e/fixture
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
