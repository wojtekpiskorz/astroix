name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (biome · tsc · vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # pin npm to packageManager (keep in sync): setup-node bundles whatever
      # npm shipped with the runner's Node 24 patch (11.17.0 on 24.19.0), and
      # a newer npm's `npm ci` validation rejects lockfiles generated by a
      # different npm version (#211)
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      # the fixture install must precede npm test: the retirement-readiness
      # legs run under the root vitest config (npm test) and build the
      # canonical fixture (e2e/fixture has its own committed lockfile)
      - run: npm ci
        working-directory: e2e/fixture
      # vitest: the retained unit lanes (src/core tooling, packages/core,
      # packages/app-shell), the frozen-contract schema validators, and
      # the five serverless retirement-readiness legs (corpora
      # re-derivation, retained-UI coupling scan + mounts, fixture
      # plainness + zero-byte build, counts, inventory)
      - run: npm run test

  # ── the web protocol checkpoint (K4, #257) — the ONE authoritative ──
  # ── product-web job, replacing the retirement interval's explicit   ──
  # ── no-product-E2E status with a counted, fail-closed gate          ──
  # The checkpoint runs the FULL settled battery end-to-end — launcher,
  # activation, canvas, CSS inspect/write, Content inspect/write, app
  # shell, zero-injection, styles inspection, A-B-A project switching,
  # stale authority, client reset, pending diagnostics, plus the
  # plain-fixture build smoke — over the config-load staging's disposable
  # fixture copies on a per-invocation nonce root (never an adopted
  # server, `reuseExistingServer: false` #350), then validates the
  # reported case inventory against the checked-in
  # apps/web/e2e/checkpoint-inventory.json: zero discovered cases, a red
  # or truncated run, duplicate case IDs, skip/todo/fixme, focused leaks
  # (a `test.only` reports only its case — the missing-IDs check fires),
  # and unregistered new cases all fail it. The playwright config's own
  # vacuity guards (#240/#408/#435) stay load-bearing at config load.
  # This job is deterministic-gated beside `check` (both must be green
  # to merge); the advisory ai-review job stays untouched by design.
  product-web:
    name: product-web (counted web protocol checkpoint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      # the battery's plain-build leg builds the canonical fixture
      # (e2e/fixture has its own committed lockfile)
      - run: npm ci
        working-directory: e2e/fixture
      - run: npx playwright install --with-deps chromium
      # the gate proves its own teeth before it gates anything: every
      # fail-closed mode (empty, missing, duplicate, skipped, focused,
      # truncated inventories) plus this CI law itself
      - run: npm run test:web-gate
      - name: web protocol checkpoint — full counted battery over disposable fixture copies
        run: npm run check:web
      # retained failure artifacts (#129's doctrine): the full Playwright
      # JSON report and test-results survive every red run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-checkpoint-artifacts
          path: test-results/
          if-no-files-found: ignore

  # Retirement gate context (#215, lane A6): the integration runtime,
  # injected chrome, delivery lanes, npm artifact checks, Changesets, and
  # publish workflows are deleted; the root package is private. What CI
  # gates on is the retained tree: the deterministic check job above
  # (lint + types + the vitest lanes) plus the counted product-web
  # checkpoint (#257) — the no-product-E2E interval status this workflow
  # carried is retired with it, not green alongside it.
