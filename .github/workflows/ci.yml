name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (biome · tsc · vitest · artifact · dist-graph)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # pin npm to packageManager (keep in sync): setup-node bundles whatever
      # npm shipped with the runner's Node 24 patch (11.17.0 on 24.19.0), and
      # a newer npm's `npm ci` validation rejects lockfiles generated by a
      # different npm version (#211)
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run test
      # build both outputs and gate the prebuilt chrome shape (ADR-0001)
      - run: npm run build
      - run: npm run check:artifact
      # the node-side dist graph must stay inside builtins + dependencies + peers (#138)
      - run: npm run check:dist-graph
      # the published manifest/exports must be consumer-clean (needs the build)
      - run: npm run check:publint
      # plain-fixture build smoke + the frozen behavior-contract suite
      # (B1, #284): the freeze legs boot chromium + disposable oracles.
      # The suite's skip-guard probes the executable, so this install is
      # what turns the freeze on in CI (#285).
      - run: npm ci
        working-directory: e2e/fixture
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # No-E2E interval (ADR-0010, amended 2026-09-01 — owner ruling on #197):
  # no product E2E lane exists until the web-host slices land, and CI never
  # presents the interval as passing product E2E. What the check job runs
  # instead is not product E2E: the serverless plain-fixture build smoke and
  # the frozen behavior-contract suite (B1, #284) — capture evidence over
  # the retired implementation as oracle, not regression lanes for a product.
