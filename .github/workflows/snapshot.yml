name: Experimental snapshot

# PAUSED by the Electron rewrite (lane A2, #211; ADR-0010,
# docs/agents/release-loop.md): npm publication — stable and snapshot — is
# dormant. The job below is hard-disabled, so even a manual dispatch runs
# nothing; any run during the pause is an incident (release-loop.md). The
# retirement lane deletes this workflow; the steps are dormant provenance,
# kept for reference in the npm toolchain.
on:
  workflow_dispatch:

# ephemeral publish job: the version output is never committed or pushed back,
# so the changeset queue and changelog on main stay untouched
permissions:
  contents: read

concurrency:
  group: experimental-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: snapshot (experimental channel)
    if: false # paused — see the workflow header; do not re-enable without an owner ruling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run check:artifact
      - name: Version (snapshot, experimental)
        run: |
          pending=$(ls .changeset/*.md 2>/dev/null | grep -v 'README.md' | wc -l)
          if [ "$pending" -eq 0 ]; then
            echo "::warning::No pending changesets: this snapshot publishes nothing (main HEAD == latest stable release)"
          fi
          npx changeset version --snapshot experimental
        # never run snapshot publish bare: without --tag the snapshot lands on latest
      - run: npx changeset publish --tag experimental --no-git-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
