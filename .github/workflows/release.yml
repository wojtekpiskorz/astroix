name: Stable release

# PAUSED by the Electron rewrite (lane A2, #211; ADR-0010,
# docs/agents/release-loop.md): npm publication is dormant and the
# changesets queue is never released. The automatic push trigger is removed
# and the job below is hard-disabled — even a manual dispatch runs nothing.
# Any run during the pause is an incident (release-loop.md). The retirement
# lane deletes this workflow; the steps are dormant provenance, kept for
# reference in the npm toolchain.
on:
  workflow_dispatch:

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    name: release (stable channel)
    if: false # paused — see the workflow header; do not re-enable without an owner ruling
    runs-on: ubuntu-latest
    permissions:
      contents: write # push version commit + tags
      pull-requests: write # open Version Packages PR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org # writes .npmrc using NODE_AUTH_TOKEN
      - run: npm ci
      # SHA-pinned v2.1.1 (upstream v2 is a moving branch, no major tag): this job
      # holds contents:write + pull-requests:write + NPM_TOKEN — the most privileged
      # action in the repo, so ref movement must not swap code under it silently
      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          # the action runs these through @actions/exec WITHOUT a shell: one
          # command each, no && chains (operators land as argv on the command —
          # vite dies on "Unused args"); the publish chain lives in
          # package.json#ci:publish
          version-script: npx changeset version
          publish-script: npm run ci:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # the granular access token
