name: Stable release

on:
  push:
    branches: [main]

# sketch #1 from research/release-channels.md (branch research/release-channels):
# non-empty changeset queue -> opens/updates the "Version Packages" PR; empty queue
# (that PR just merged) -> the publish script runs -> latest. Needs the repo setting
# "Allow GitHub Actions to create and approve pull requests" and a publish-capable
# NPM_TOKEN (bypass 2FA, see #59 / #48).
concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    name: release (stable channel)
    runs-on: ubuntu-latest
    permissions:
      contents: write # push version commit + tags
      pull-requests: write # open Version Packages PR
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org # writes .npmrc using NODE_AUTH_TOKEN
      - run: bun install --frozen-lockfile
      - uses: changesets/action@v2
        with:
          version: bunx changeset version
          publish: bun run build && bunx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # the GAT
